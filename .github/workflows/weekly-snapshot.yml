name: Weekly technology snapshot

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependency
        run: python -m pip install requests

      - name: Collect weekly snapshot
        run: python -m app.data_collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add weekly technology snapshot"
          branch: automation/weekly-technology-snapshot
          delete-branch: true
          title: "Add weekly technology snapshot"
          body: "Automated weekly technology snapshot."
          add-paths: data/raw/snapshot_*.csv
